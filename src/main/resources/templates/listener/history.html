<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='Listening History', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .top-bar .search-wrapper {
                display: none;
            }
        </style>
        <style>
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
            }

            .btn-danger {
                background: transparent;
                border: 1px solid #ff5252;
                color: #ff5252;
                padding: 8px 20px;
                border-radius: 20px;
                font-size: 0.85em;
                cursor: pointer;
            }

            .btn-danger:hover {
                background: #ff5252;
                color: white;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: #181818;
                border-radius: 8px;
                overflow: hidden;
            }

            th {
                text-align: left;
                color: #b3b3b3;
                border-bottom: 1px solid #282828;
                padding: 12px 14px;
                font-size: 0.8em;
                text-transform: uppercase;
                background: #1a1a1a;
            }

            td {
                padding: 12px 14px;
                border-bottom: 1px solid #1a1a1a;
            }

            tr:hover td {
                background: #222;
            }
        </style>

        <div class="page-header">
            <div>
                <h2 style="margin-bottom: 8px;">🕓 Listening History</h2>
                <p class="sub" th:text="'Logged in as: ' + ${email}" style="color: var(--text-sub); font-size: 0.9em;">
                </p>
            </div>
            <form method="post" action="/user/history/clear" th:if="${!#lists.isEmpty(history)}">
                <button type="submit" class="btn-danger" onclick="return confirm('Clear all listening history?')">🗑
                    Clear History</button>
            </form>
        </div>

        <div class="success-msg" th:if="${param.cleared}"
            style="background: rgba(29, 185, 84, 0.1); color: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 20px;">
            ✅ Listening history cleared.</div>

        <table th:if="${!#lists.isEmpty(history)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Song</th>
                    <th>Played At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item, stat : ${history}">
                    <td style="color:#b3b3b3;" th:text="${stat.index + 1}">1</td>
                    <td>🎵 <span th:text="${item.songTitle != null ? item.songTitle : 'Deleted Song'}">Song Title</span>
                    </td>
                    <td style="color:#b3b3b3;"
                        th:text="${item.playedAt != null ? #temporals.format(item.playedAt, 'MMM dd, yyyy HH:mm') : 'N/A'}">
                        Jan 01, 2025 12:00</td>
                    <td>
                        <span
                            style="background:#1a1a3a; color:#7986cb; padding: 2px 10px; border-radius: 10px; font-size: 0.78em;"
                            th:text="${item.actionType != null ? item.actionType : 'play'}">play</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" style="text-align: center; padding: 60px; display: none;">
            <p style="font-size:3em;">🕓</p>
            <p style="margin-top:12px;">No history items match your search.</p>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
    </div>
</body>

</html>
