<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='View Songs', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .page-banner {
                background: linear-gradient(to bottom, #282828, #121212);
                padding: 40px;
                border-radius: 12px;
                margin-bottom: 30px;
                display: flex;
                align-items: flex-end;
                gap: 24px;
            }

            .banner-icon {
                width: 160px;
                height: 160px;
                background: #333;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 5em;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
                color: #1DB954;
            }

            .banner-info {
                flex: 1;
            }

            .banner-info h1 {
                font-size: 3em;
                margin-bottom: 12px;
            }

            .banner-info p {
                color: #b3b3b3;
                font-size: 0.9em;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th {
                text-align: left;
                padding: 12px;
                color: #b3b3b3;
                border-bottom: 1px solid #282828;
                font-size: 0.85em;
                text-transform: uppercase;
            }

            td {
                padding: 12px;
                border-bottom: 1px solid #1a1a1a;
            }

            tr:hover td {
                background: #282828;
            }

            .play-btn-small {
                background: #1DB954;
                color: white;
                border: none;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s;
            }

            .play-btn-small:hover {
                transform: scale(1.1);
                background: #1ed760;
            }
        </style>

        <div class="page-banner">
            <div class="banner-icon"
                th:style="${artist != null} ? 'border-radius: 50%; overflow: hidden;' : 'overflow: hidden;'">
                <!-- Album -->
                <img th:if="${album != null and album.coverImageUrl != null and !album.coverImageUrl.isEmpty()}"
                    th:src="${album.coverImageUrl}" style="width:100%; height:100%; object-fit:cover;">
                <span
                    th:if="${album != null and (album.coverImageUrl == null or album.coverImageUrl.isEmpty())}">💿</span>

                <!-- Artist -->
                <img th:if="${artist != null and artist.profileImageUrl != null and !artist.profileImageUrl.isEmpty()}"
                    th:src="${artist.profileImageUrl}" style="width:100%; height:100%; object-fit:cover;">
                <span
                    th:if="${artist != null and (artist.profileImageUrl == null or artist.profileImageUrl.isEmpty())}">👤</span>

                <!-- Genre -->
                <span th:if="${genre != null}">🎸</span>
            </div>
            <div class="banner-info">
                <p th:if="${album != null}">ALBUM</p>
                <p th:if="${artist != null}">ARTIST</p>
                <p th:if="${genre != null}">GENRE</p>
                <h1
                    th:text="${album != null ? album.title : (artist != null ? artist.stageName : (genre != null ? genre.genreName : 'Songs'))}">
                    Title</h1>
                <p th:text="${#lists.size(songs)} + ' songs'"></p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th></th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Duration</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="song, stat : ${songs}" th:data-song-id="${song.songId}"
                    th:onclick="'playSong(' + ${song.songId} + ')'" style="cursor: pointer;">
                    <td style="color: #b3b3b3;" th:text="${stat.index + 1}">1</td>
                    <td>
                        <button class="play-btn-small"
                            th:onclick="'event.stopPropagation(); playSong(' + ${song.songId} + ')'">
                            ▶
                        </button>
                    </td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img th:if="${song.coverImageUrl != null && !song.coverImageUrl.isEmpty()}"
                                th:src="${song.coverImageUrl}" alt="Cover"
                                style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover;">
                            <div th:if="${song.coverImageUrl == null || song.coverImageUrl.isEmpty()}"
                                style="width: 40px; height: 40px; border-radius: 4px; background: #282828; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                                🎵</div>
                            <div style="font-weight: 500;" th:text="${song.title}">Song Title</div>
                        </div>
                    </td>
                    <td style="color: #b3b3b3;" th:text="${song.artistName}">Artist</td>
                    <td style="color: #b3b3b3;"
                        th:text="${(song.durationSeconds / 60) + ':' + (song.durationSeconds % 60 < 10 ? '0' : '') + (song.durationSeconds % 60)}">
                        3:45</td>
                    <td>
                        <button class="like-btn" th:data-song-id="${song.songId}"
                            th:onclick="'event.stopPropagation(); toggleLike(' + ${song.songId} + ', this)'"
                            th:classappend="${song.favorite ? 'liked' : ''}"
                            style="background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s; color: #b3b3b3;">
                            <span class="heart-icon" th:text="${song.favorite ? '❤️' : '🤍'}">🤍</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(songs)}" class="empty-state" style="text-align: center; padding: 60px;">
            <p style="font-size: 3em;">🎵</p>
            <p style="margin-top: 16px; color: #b3b3b3;">No songs found for this selection.</p>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">
            window.pageSongs = /*[[${songs}]]*/[];
        </script>
    </div>
</body>

</html>
