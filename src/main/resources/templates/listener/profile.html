<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='Profile', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .profile-header {
                display: flex;
                align-items: center;
                gap: 30px;
                margin-bottom: 40px;
                background: linear-gradient(135deg, #1a1a1a, #282828);
                padding: 30px;
                border-radius: 12px;
            }

            .avatar-circle {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background: linear-gradient(135deg, #1DB954, #1a8a3a);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2.5em;
                flex-shrink: 0;
                overflow: hidden;
            }

            .profile-info h1 {
                font-size: 1.8em;
            }

            .profile-info p {
                color: #b3b3b3;
                margin-top: 5px;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                margin-top: 30px;
            }

            .stat-card {
                background: #181818;
                padding: 24px;
                border-radius: 10px;
                text-align: center;
                border: 1px solid #282828;
                transition: border-color 0.2s;
            }

            .stat-card:hover {
                border-color: #1DB954;
            }

            .stat-card h3 {
                color: #1DB954;
                font-size: 2.4em;
                margin-bottom: 6px;
            }

            .stat-card p {
                color: #b3b3b3;
                font-size: 0.9em;
            }

            .quick-links {
                margin-top: 30px;
            }

            .quick-links h2 {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .link-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .link-card {
                background: #181818;
                padding: 16px 20px;
                border-radius: 8px;
                text-decoration: none;
                color: white;
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid #282828;
                transition: all 0.2s;
            }

            .link-card:hover {
                border-color: #1DB954;
                background: #1a1a1a;
            }

            .link-card span {
                font-size: 1.5em;
            }

            .edit-modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }

            .modal-content {
                background: #282828;
                padding: 30px;
                border-radius: 12px;
                width: 400px;
                max-width: 90%;
            }
        </style>

        <div class="profile-header">
            <div class="avatar-circle">
                <img th:if="${user != null && user.profileImageUrl != null}" th:src="${user.profileImageUrl}"
                    style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                <span
                    th:if="${user == null || (isArtist ? user.profileImageUrl == null : user.profileImageUrl == null)}"
                    th:text="${user != null ? (isArtist ? (user.stageName != null ? user.stageName.substring(0,1).toUpperCase() : '🎤') : (user.fullName != null ? user.fullName.substring(0,1).toUpperCase() : '👤')) : '👤'}">👤</span>
            </div>
            <div class="profile-info">
                <h1 th:if="${isArtist}" th:text="${user != null ? user.stageName : email}">Artist Name</h1>
                <h1 th:if="${!isArtist}" th:text="${user != null ? user.fullName : email}">User Name</h1>
                <p th:text="${email}">user@example.com</p>
                <p style="margin-top:8px; color:#1DB954; font-size:0.9em; font-weight: bold;"
                    th:text="${isArtist ? 'ARTIST' : 'LISTENER'}">Listener</p>
                <button onclick="document.getElementById('editModal').style.display='flex'"
                    style="margin-top:15px; background:transparent; border:1px solid #555; color:white; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85em;">
                    Edit Profile
                </button>
            </div>
        </div>

        <div th:if="${param.updated}"
            style="background: #1DB954; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px;">Profile
            updated successfully!</div>

        <div class="stats-grid">
            <div th:if="${!isArtist}" class="stat-card">
                <h3 th:text="${totalPlaylists}">0</h3>
                <p>Playlists Created</p>
            </div>
            <div th:if="${isArtist}" class="stat-card">
                <h3 th:text="${totalSongs}">0</h3>
                <p>Songs Uploaded</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${isArtist ? totalPlays : totalFavorites}">0</h3>
                <p th:text="${isArtist ? 'Total Plays' : 'Favorite Songs'}">Favorite Songs</p>
            </div>
            <div class="stat-card">
                <h3>💎</h3>
                <p th:text="${isArtist ? 'Verified Artist' : 'Premium Listener'}">Active Listener</p>
            </div>
        </div>

        <div class="quick-links">
            <h2>Quick Access</h2>
            <div class="link-grid">
                <a th:href="${isArtist ? '/artist/my-songs' : '/user/favorites'}" class="link-card">
                    <span th:text="${isArtist ? '🎶' : '❤️'}">❤️</span>
                    <th:block th:text="${isArtist ? 'My Songs' : 'Favorite Songs'}"></th:block>
                </a>
                <a th:href="${isArtist ? '/artist/albums' : '/user/playlists'}" class="link-card">
                    <span th:text="${isArtist ? '💿' : '🎵'}">🎵</span>
                    <th:block th:text="${isArtist ? 'My Albums' : 'My Playlists'}"></th:block>
                </a>
                <a href="/user/history" class="link-card"><span>🕓</span> Listening History</a>
                <a href="/user/library" class="link-card"><span>📚</span> Browse Music</a>
            </div>
        </div>

        <!-- Edit Profile Modal -->
        <div id="editModal" class="edit-modal">
            <div class="modal-content">
                <h2 style="margin-bottom:20px;">Edit Profile</h2>
                <form action="/user/profile/update" method="POST" enctype="multipart/form-data">
                    <div style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:5px; color:#b3b3b3;">Full Name / Stage Name</label>
                        <input th:if="${isArtist}" type="text" name="fullName"
                            th:value="${user != null ? user.stageName : ''}" required
                            style="width:100%; padding:10px; background:#333; border:1px solid #444; color:white; border-radius:4px;">
                        <input th:if="${!isArtist}" type="text" name="fullName"
                            th:value="${user != null ? user.fullName : ''}" required
                            style="width:100%; padding:10px; background:#333; border:1px solid #444; color:white; border-radius:4px;">
                    </div>
                    <div th:if="${isArtist}" style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:5px; color:#b3b3b3;">Bio</label>
                        <textarea name="bio" th:text="${user != null ? user.bio : ''}" rows="3"
                            style="width:100%; padding:10px; background:#333; border:1px solid #444; color:white; border-radius:4px;"></textarea>
                    </div>
                    <div style="margin-bottom:20px;">
                        <label style="display:block; margin-bottom:5px; color:#b3b3b3;">Profile Photo</label>
                        <input type="file" name="profilePhoto" accept="image/*"
                            style="width:100%; color:#b3b3b3; font-size:0.9em;">
                    </div>
                    <div style="display:flex; gap:10px; justify-content:flex-end;">
                        <button type="button" onclick="document.getElementById('editModal').style.display='none'"
                            style="padding:10px 20px; background:transparent; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">Cancel</button>
                        <button type="submit"
                            style="padding:10px 20px; background:#1DB954; border:none; color:white; border-radius:4px; cursor:pointer; font-weight:bold;">Save
                            Changes</button>
                    </div>
                </form>
            </div>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
    </div>
</body>

</html>
