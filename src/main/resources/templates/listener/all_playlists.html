<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='All Playlists', content=~{::content}, scripts=~{::scripts}, showSearch=true)}">

<body>
    <div th:fragment="content">
        <style>
            .playlist-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 24px;
                margin-top: 24px;
            }

            .playlist-card {
                background: #181818;
                padding: 24px;
                border-radius: 12px;
                border: 1px solid #282828;
                transition: all 0.3s ease;
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }

            .playlist-card:hover {
                background: #282828;
                border-color: #1DB954;
                transform: translateY(-5px);
            }

            .playlist-icon {
                font-size: 3rem;
                margin-bottom: 16px;
                display: block;
            }

            .playlist-card h3 {
                font-size: 1.1rem;
                margin-bottom: 8px;
                color: #fff;
            }

            .playlist-card p {
                color: #b3b3b3;
                font-size: 0.85rem;
                margin-bottom: 16px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                line-height: 1.4;
            }

            .btn-view {
                display: inline-block;
                background: #1DB954;
                color: white;
                text-decoration: none;
                padding: 8px 20px;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: bold;
                transition: background 0.2s;
            }

            .btn-view:hover {
                background: #1ed760;
                color: white;
            }

            .badge {
                background: #1DB954;
                color: black;
                border-radius: 12px;
                padding: 2px 10px;
                font-size: 0.8rem;
                font-weight: bold;
                margin-left: 12px;
                vertical-align: middle;
            }

            .public-indicator {
                position: absolute;
                top: 12px;
                right: 12px;
                font-size: 1.2rem;
                opacity: 0.6;
            }

            .search-wrapper {
                margin-bottom: 30px;
            }

            /* Show search bar on this page */
            .top-bar .search-wrapper {
                display: block !important;
            }
        </style>

        <div style="margin-top: 16px; margin-bottom: 32px;">
            <h1 style="display: flex; align-items: center;">
                🌎 Discover Playlists
                <span class="badge" th:text="${#lists.size(playlists)}">0</span>
            </h1>
            <p style="color: #b3b3b3; margin-top: 8px;">Explore public collections from the RevPlay community</p>
        </div>

        <div class="playlist-grid" th:if="${!#lists.isEmpty(playlists)}">
            <a class="playlist-card" th:each="playlist : ${playlists}"
                th:href="@{'/user/playlists/' + ${playlist.playlistId}}"
                style="display: block; text-decoration: none; color: inherit;">
                <span class="public-indicator">🌍</span>
                <div class="playlist-icon">🎵</div>
                <h3 th:text="${playlist.name}">Playlist Name</h3>
                <p
                    th:text="${playlist.description != null && !playlist.description.isEmpty() ? playlist.description : 'No description provided.'}">
                    Description
                </p>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span class="btn-view">Listen Now</span>
                </div>
            </a>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(playlists)}"
            style="text-align: center; color: #b3b3b3; padding: 100px 20px; background: #121212; border-radius: 12px;">
            <p style="font-size: 4rem; margin-bottom: 20px;">🌍</p>
            <h3>No public playlists found</h3>
            <p style="margin-top: 8px;">Be the first to share your music with the world!</p>
        </div>

        <div style="height: 120px;"></div>
    </div>

    <div th:fragment="scripts">
    </div>
</body>

</html>
