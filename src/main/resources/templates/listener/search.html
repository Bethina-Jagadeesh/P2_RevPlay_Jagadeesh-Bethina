<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='Search', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .search-container {
                margin-bottom: 32px;
            }

            .search-form {
                display: flex;
                gap: 12px;
                max-width: 600px;
            }

            .search-input {
                flex: 1;
                background: var(--bg-elevated);
                border: 1px solid #333;
                color: white;
                padding: 12px 24px;
                border-radius: 30px;
                font-size: 1rem;
            }

            .search-input:focus {
                outline: none;
                border-color: var(--primary);
            }

            .search-btn {
                background: var(--primary);
                color: white;
                border: none;
                padding: 12px 32px;
                border-radius: 30px;
                font-weight: 700;
                cursor: pointer;
            }

            .results-table {
                width: 100%;
                border-collapse: collapse;
            }

            .results-table th {
                text-align: left;
                color: #b3b3b3;
                border-bottom: 1px solid #282828;
                padding: 10px;
                font-size: 0.85em;
                text-transform: uppercase;
            }

            .results-table td {
                padding: 12px 10px;
                border-bottom: 1px solid #1a1a1a;
            }

            .results-table tr:hover td {
                background: #1a1a1a;
            }

            .btn-fav {
                border: 1px solid #333;
                color: white;
                background: transparent;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 0.8rem;
                cursor: pointer;
            }

            .btn-fav:hover {
                background: var(--primary);
                border-color: var(--primary);
            }
        </style>

        <h2 style="margin-bottom: 8px;">🔍 Search</h2>
        <p class="sub" th:text="'Logged in as: ' + ${email}"
            style="color: var(--text-sub); margin-bottom: 24px; font-size: 0.9em;"></p>

        <div class="search-container">
            <form method="get" action="/user/search" class="search-form">
                <input type="text" name="q" class="search-input" th:value="${query}"
                    placeholder="Search songs by title..." autofocus>
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div th:if="${!#strings.isEmpty(query)}">
            <p style="color:#b3b3b3; margin-bottom: 24px; font-size: 0.9rem;">
                Displaying results for: <span th:text="'&quot;' + ${query} + '&quot;'"
                    style="color: var(--primary); font-weight: 700;"></span>
                &nbsp;·&nbsp; <span th:text="${#lists.size(songs)}">0</span> song(s) found
            </p>

            <table class="results-table" th:if="${!#lists.isEmpty(songs)}">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th></th>
                        <th>Title</th>
                        <th>Artist</th>
                        <th>Duration</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="song, stat : ${songs}" th:data-song-id="${song.songId}"
                        th:onclick="'playSong(' + ${song.songId} + ')'" style="cursor: pointer;">
                        <td style="color:#b3b3b3;" th:text="${stat.index + 1}">1</td>
                        <td style="width: 40px;">
                            <button class="play-btn-small" th:onclick="'playSong(' + ${song.songId} + ')'"
                                style="background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">▶</button>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img th:if="${song.coverImageUrl != null && !song.coverImageUrl.isEmpty()}"
                                    th:src="${song.coverImageUrl}" alt="Cover"
                                    style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover;">
                                <div th:if="${song.coverImageUrl == null || song.coverImageUrl.isEmpty()}"
                                    style="width: 40px; height: 40px; border-radius: 4px; background: #282828; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                                    🎵</div>
                                <span th:text="${song.title}" style="font-weight: 500;">Song Title</span>
                            </div>
                        </td>
                        <td style="color:#b3b3b3;"
                            th:text="${song.artistName != null ? song.artistName : 'Artist #' + song.artistId}">Artist
                        </td>
                        <td style="color:#b3b3b3;"
                            th:text="${(song.durationSeconds / 60) + ':' + (song.durationSeconds % 60 < 10 ? '0' : '') + (song.durationSeconds % 60)}">
                            3:30</td>
                        <td>
                            <button class="like-btn" th:data-song-id="${song.songId}"
                                th:onclick="'event.stopPropagation(); toggleLike(' + ${song.songId} + ', this)'"
                                th:classappend="${song.favorite ? 'liked' : ''}"
                                style="background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s; color: #b3b3b3;">
                                <span class="heart-icon" th:text="${song.favorite ? '❤️' : '🤍'}">🤍</span>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="empty-state" th:if="${#lists.isEmpty(songs)}" style="text-align: center; padding: 60px;">
                <p style="font-size:3em;">🔍</p>
                <p style="margin-top:12px;">No songs found matching your search.</p>
            </div>
            <div class="empty-state-filter" style="text-align: center; padding: 60px; display: none;">
                <p style="font-size:3em;">🔍</p>
                <p style="margin-top:12px;">No results found in these matches.</p>
            </div>
        </div>

        <div class="empty-state" th:if="${#strings.isEmpty(query)}" style="text-align: center; padding: 60px;">
            <p style="font-size:3em;">🎵</p>
            <p style="margin-top:12px;">Start typing to search for songs.</p>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">
            window.searchSongs = /*[[${songs}]]*/[];
        </script>
    </div>
</body>

</html>
