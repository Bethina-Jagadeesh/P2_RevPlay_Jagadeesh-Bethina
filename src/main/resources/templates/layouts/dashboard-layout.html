<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(title, content, scripts)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - RevPlay'">RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: header(showSearch=${showSearch != null ? showSearch : true})}"></div>
        <div th:replace="${content}"></div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/main.js?v=4.1}"></script>
    <script th:src="@{/js/player.js?v=4.1}"></script>
    <div th:replace="${scripts}"></div>

    <!-- Global Playlist Modal -->
    <div id="playlistModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center;">
        <div
            style="background:#282828; border-radius:12px; width:100%; max-width:400px; padding:30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size:1.5rem; color:#fff;">Add to Playlist</h2>
                <button onclick="closePlaylistModal()"
                    style="background:transparent; border:none; font-size:1.5rem; color:#b3b3b3; cursor:pointer;">&times;</button>
            </div>

            <div id="playlistLoader" style="text-align:center; padding:20px;">Loading...</div>
            <div id="playlistList" style="max-height:300px; overflow-y:auto; display:none;">
                <!-- Playlists are listed here -->
            </div>

            <hr style="border:none; border-top:1px solid #444; margin:20px 0;">
            <div style="text-align:center;">
                <a href="/user/playlists#createPlaylistForm" onclick="closePlaylistModal()"
                    style="display:block; background:#1DB954; color:white; text-decoration:none; padding:12px; border-radius:4px; font-weight:700; cursor:pointer; font-size:0.9rem;">
                    + Create New Playlist
                </a>
                <p style="color:#b3b3b3; font-size:0.75rem; margin-top:12px;">Redirects to the full playlist creation
                    page</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let currentPlaylistSongId = null;

        function openPlaylistModal(e, songId) {
            if (e) e.stopPropagation();
            currentPlaylistSongId = songId;
            const modal = document.getElementById('playlistModal');
            modal.style.display = 'flex';
            loadUserPlaylists();
        }

        function closePlaylistModal() {
            document.getElementById('playlistModal').style.display = 'none';
        }

        function loadUserPlaylists() {
            const list = document.getElementById('playlistList');
            const loader = document.getElementById('playlistLoader');
            list.style.display = 'none';
            loader.style.display = 'block';

            fetch('/user/api/playlists')
                .then(res => res.json())
                .then(playlists => {
                    loader.style.display = 'none';
                    list.style.display = 'block';
                    list.innerHTML = '';

                    if (!playlists || playlists.length === 0) {
                        list.innerHTML = '<p style="color:#b3b3b3; text-align:center; padding:10px;">No playlists found.</p>';
                        return;
                    }

                    playlists.forEach(pl => {
                        const item = document.createElement('div');
                        item.style = 'padding:12px; border-radius:4px; cursor:pointer; color:#fff; transition:background 0.2s; display:flex; align-items:center; gap:10px;';
                        item.onmouseover = () => item.style.background = '#3e3e3e';
                        item.onmouseout = () => item.style.background = 'transparent';
                        item.onclick = () => addToExistingPlaylist(pl.playlistId, pl.name);
                        item.innerHTML = `<i class="fas fa-music" style="color:#1DB954; font-size:1rem;"></i> <span>${pl.name}</span>`;
                        list.appendChild(item);
                    });
                })
                .catch(err => {
                    console.error('Error loading playlists:', err);
                    loader.innerText = 'Error loading playlists.';
                });
        }

        function addToExistingPlaylist(playlistId, playlistName) {
            fetch(`/user/api/playlists/${playlistId}/songs/add/${currentPlaylistSongId}`, {
                method: 'POST'
            })
                .then(res => res.json())
                .then(data => {
                    alert(`Song added to "${playlistName}"`);
                    closePlaylistModal();
                });
        }

    </script>
</body>

</html>
