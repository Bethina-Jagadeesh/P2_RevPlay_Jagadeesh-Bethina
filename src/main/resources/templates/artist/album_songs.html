<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='Album Songs', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <h1>Album Songs</h1>
        <p class="sub" style="color: #b3b3b3; margin-bottom: 24px;">View and manage songs in this album.</p>

        <a href="/artist/albums" style="color: #b3b3b3; display: inline-block; margin-bottom: 24px;">← Back to
            Albums</a>

        <div class="song-list"
            style="background: var(--bg-surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border);">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; color: var(--text-sub); border-bottom: 1px solid var(--border);">
                        <th style="padding: 12px;">Title</th>
                        <th style="padding: 12px;">Plays</th>
                        <th style="padding: 12px;">Duration</th>
                        <th style="padding: 12px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="song : ${songs}" th:onclick="'playSong(' + ${song.songId} + ')'"
                        style="border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;">
                        <td style="padding: 16px 12px;" th:text="${song.title}">Song Title</td>
                        <td style="padding: 16px 12px;" th:text="${song.playCount}">0</td>
                        <td style="padding: 16px 12px;"
                            th:text="${(song.durationSeconds / 60) + ':' + (song.durationSeconds % 60 < 10 ? '0' : '') + (song.durationSeconds % 60)}">
                            0:00</td>
                        <td style="padding: 16px 12px;" onclick="event.stopPropagation();">
                            <form th:action="@{'/artist/songs/' + ${song.songId} + '/delete'}" method="POST"
                                onsubmit="return confirm('Delete this song from the album?');">
                                <button type="submit"
                                    style="background: none; border: none; color: var(--error); cursor: pointer; padding: 0;">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(songs)}">
                        <td colspan="4" style="text-align: center; color: var(--text-sub); padding: 40px;">No songs in
                            this album yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 24px;">
            <a href="/artist/upload" class="btn btn-primary"
                style="background: #1DB954; color: white; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; display: inline-block;">Add
                More Songs</a>
        </div>
        <div style="height: 120px;"></div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">
            window.allSongs = /*[[${songs}]]*/[];
        </script>
    </div>
</body>

</html>
