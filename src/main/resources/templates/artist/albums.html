<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='My Albums', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .create-card {
                background: #181818;
                padding: 24px;
                border-radius: 12px;
                margin-bottom: 30px;
                border: 1px dashed #282828;
            }

            .create-card h3 {
                margin-bottom: 16px;
                color: #1DB954;
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .form-group.full {
                grid-column: 1 / -1;
            }

            label {
                font-size: 0.8em;
                color: #b3b3b3;
            }

            input[type="text"],
            input[type="date"],
            input[type="url"] {
                background: #282828;
                border: 1px solid #383838;
                color: white;
                padding: 10px 14px;
                border-radius: 8px;
                font-size: 0.9em;
                width: 100%;
            }

            input:focus {
                outline: 1px solid #1DB954;
            }

            .btn-primary {
                background: #1DB954;
                color: white;
                border: none;
                padding: 11px 24px;
                border-radius: 24px;
                font-size: 0.9em;
                font-weight: bold;
                cursor: pointer;
                margin-top: 8px;
            }

            .btn-primary:hover {
                background: #1ed760;
            }

            .btn-danger {
                background: transparent;
                border: 1px solid #ff5252;
                color: #ff5252;
                padding: 5px 12px;
                border-radius: 20px;
                font-size: 0.78em;
                cursor: pointer;
            }

            .btn-danger:hover {
                background: #ff5252;
                color: white;
            }

            .album-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                gap: 20px;
            }

            .album-card {
                background: #181818;
                padding: 20px;
                border-radius: 10px;
                border: 1px solid #282828;
                transition: border-color 0.2s;
            }

            .album-card:hover {
                border-color: #1DB954;
            }

            .album-art {
                width: 100%;
                height: 140px;
                background: linear-gradient(135deg, #1a3a4a, #1DB954);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2.5em;
                margin-bottom: 14px;
            }

            .album-card h3 {
                font-size: 1em;
                margin-bottom: 4px;
            }

            .album-card p {
                color: #b3b3b3;
                font-size: 0.8em;
                margin-bottom: 4px;
            }

            .top-bar .search-wrapper {
                display: none;
            }
        </style>

        <h1>💿 My Albums</h1>
        <p class="sub" th:text="'Logged in as: ' + ${email}"
            style="color: #b3b3b3; margin-bottom: 25px; font-size: 0.9em;"></p>

        <div class="success-msg" th:if="${param.created}"
            style="background: #1a3a1a; color: #1DB954; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em;">
            ✅ Album created successfully!</div>
        <div class="success-msg" th:if="${param.deleted}"
            style="background:#3a1a1a; color:#ff5252; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em;">
            🗑 Album deleted.</div>

        <div class="create-card">
            <h3>➕ Create New Album</h3>
            <form method="post" action="/artist/albums/create">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Album Title *</label>
                        <input type="text" name="title" placeholder="My Album Title" required>
                    </div>
                    <div class="form-group">
                        <label>Release Date</label>
                        <input type="date" name="releaseDate">
                    </div>
                    <div class="form-group full">
                        <label>Description</label>
                        <input type="text" name="description" placeholder="What's this album about?">
                    </div>
                    <div class="form-group full">
                        <label>Cover Image URL</label>
                        <input type="url" name="coverImageUrl" placeholder="https://...">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Album</button>
            </form>
        </div>

        <div class="album-grid" th:if="${!#lists.isEmpty(albums)}">
            <div class="album-card" th:each="album : ${albums}">
                <div class="album-art">
                    <img th:if="${album.coverImageUrl != null && !album.coverImageUrl.isEmpty()}"
                        th:src="${album.coverImageUrl}" alt="Cover"
                        style="width:100%; height:100%; object-fit:cover; border-radius:8px;"
                        onerror="this.style.display='none'">
                    <span th:if="${album.coverImageUrl == null || album.coverImageUrl.isEmpty()}">💿</span>
                </div>
                <h3 th:text="${album.title}">Album Title</h3>
                <p
                    th:text="${album.releaseDate != null ? #temporals.format(album.releaseDate, 'yyyy') : 'Year unknown'}">
                    2024</p>
                <p
                    th:text="${album.description != null && !album.description.isEmpty() ? album.description : 'No description'}">
                    Description</p>
                <form th:action="@{'/artist/albums/' + ${album.albumId} + '/delete'}" method="post"
                    style="margin-top:12px; display: flex; gap: 12px; align-items: center;">
                    <a th:href="@{'/artist/albums/' + ${album.albumId} + '/songs'}"
                        style="font-size: 0.8rem; color: var(--primary);">View Songs</a>
                    <button type="submit" class="btn-danger" onclick="return confirm('Delete this album?')">🗑
                        Delete</button>
                </form>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(albums)}"
            style="text-align: center; color: #b3b3b3; padding: 50px;">
            <p style="font-size:3em;">💿</p>
            <p style="margin-top:12px;">No albums yet. Create your first album above!</p>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
    </div>
</body>

</html>
