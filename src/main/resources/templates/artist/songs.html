<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='My Songs', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .top-bar .search-wrapper {
                display: none;
            }
        </style>
        <style>
            .top-bar .search-wrapper {
                display: none;
            }
        </style>
        <h1>🎶 My Songs</h1>
        <p class="sub" th:text="'You have uploaded ' + ${#lists.size(songs)} + ' songs'"
            style="color: #b3b3b3; margin-bottom: 24px;"></p>

        <div style="margin-bottom: 24px;">
            <a href="/artist/upload" class="btn btn-primary"
                style="background: #1DB954; color: white; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; display: inline-block;">
                <span class="icon">📤</span> Upload New Song
            </a>
        </div>

        <div class="song-list"
            style="background: #181818; padding: 24px; border-radius: 12px; border: 1px solid #282828;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; color: #b3b3b3; border-bottom: 1px solid #282828;">
                        <th style="padding: 12px;">#</th>
                        <th style="padding: 12px;">Title</th>
                        <th style="padding: 12px;">Genre</th>
                        <th style="padding: 12px;">Album</th>
                        <th style="padding: 12px;">Plays</th>
                        <th style="padding: 12px;">Duration</th>
                        <th style="padding: 12px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="song, stat : ${songs}" th:data-song-id="${song.songId}"
                        th:onclick="'playSong(' + ${song.songId} + ')'"
                        style="border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;">
                        <td style="padding: 16px 12px; color: #b3b3b3;" th:text="${stat.index + 1}">1</td>
                        <td style="padding: 16px 12px; font-weight: 500;">
                            <span th:text="${song.title}">Song Title</span>
                        </td>
                        <td style="padding: 16px 12px; color: #b3b3b3;" th:text="${song.genreName}">Genre</td>
                        <td style="padding: 16px 12px; color: #b3b3b3;"
                            th:text="${song.albumName != null ? song.albumName : 'Single'}">Album</td>
                        <td style="padding: 16px 12px;" th:text="${song.playCount}">0</td>
                        <td style="padding: 16px 12px; color: #b3b3b3;"
                            th:text="${(song.durationSeconds / 60) + ':' + (song.durationSeconds % 60 < 10 ? '0' : '') + (song.durationSeconds % 60)}">
                            0:00</td>
                        <td style="padding: 16px 12px;" onclick="event.stopPropagation();">
                            <form th:action="@{'/artist/songs/' + ${song.songId} + '/delete'}" method="POST"
                                onsubmit="return confirm('Delete this song? This action cannot be undone.');">
                                <button type="submit"
                                    style="background: none; border: none; color: #ff5252; cursor: pointer; padding: 0;">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(songs)}">
                        <td colspan="7" style="text-align: center; color: #b3b3b3; padding: 60px;">
                            <p style="font-size: 3em;">🎶</p>
                            <p style="margin-top: 16px;">You haven't uploaded any songs yet.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div style="height: 120px;"></div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">
            window.pageSongs = /*[[${songs}]]*/[];
        </script>
    </div>
</body>

</html>
