<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/dashboard-layout :: layout(title='My Podcasts', content=~{::content}, scripts=~{::scripts})}">

<body>
    <div th:fragment="content">
        <style>
            .podcast-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 24px;
                margin-top: 20px;
            }

            .podcast-card {
                background: #181818;
                padding: 20px;
                border-radius: 12px;
                border: 1px solid #282828;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .podcast-card:hover {
                border-color: #1DB954;
            }

            .podcast-icon {
                font-size: 2.5em;
                color: #1DB954;
                background: #282828;
                width: 80px;
                height: 80px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .podcast-info h3 {
                font-size: 1.2em;
                margin-bottom: 4px;
            }

            .podcast-info .category {
                font-size: 0.8em;
                background: #333;
                color: #1DB954;
                padding: 2px 8px;
                border-radius: 12px;
                display: inline-block;
                margin-bottom: 8px;
            }

            .podcast-info p {
                font-size: 0.85em;
                color: #b3b3b3;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .form-card {
                background: #181818;
                padding: 24px;
                border-radius: 12px;
                border: 1px dashed #282828;
                margin-bottom: 32px;
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .form-group.full {
                grid-column: 1 / -1;
            }

            input,
            select,
            textarea {
                background: #282828;
                border: 1px solid #383838;
                color: white;
                padding: 12px;
                border-radius: 8px;
                font-size: 0.9em;
            }

            input:focus {
                outline: 1px solid #1DB954;
            }

            .btn-submit {
                background: #1DB954;
                color: white;
                border: none;
                padding: 12px 24px;
                border-radius: 24px;
                font-weight: bold;
                cursor: pointer;
                margin-top: 16px;
            }

            .error-msg {
                background: #3a1a1a;
                color: #ff5252;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
            }
        </style>

        <h1>📻 My Podcasts</h1>
        <p class="sub" style="color: #b3b3b3; margin-bottom: 20px;">Create and manage your podcast shows</p>

        <div class="error-msg" th:if="${param.error == 'file_too_large'}">⚠️ File is too large. Maximum size is 50MB.
        </div>
        <div class="error-msg" th:if="${param.error == 'upload_failed'}">⚠️ Upload failed. Please try again.</div>
        <div class="success-msg" th:if="${param.created}"
            style="background: #1a3a1a; color: #1DB954; padding: 12px; border-radius: 8px; margin-bottom: 20px;">✅
            Podcast created successfully!</div>

        <div class="form-card">
            <h3>🎙️ Create New Podcast</h3>
            <form method="post" action="/artist/podcasts/create" enctype="multipart/form-data"
                style="margin-top: 20px;">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Podcast Title *</label>
                        <input type="text" name="title" placeholder="The RevShow" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select name="category" required>
                            <option value="Music">Music</option>
                            <option value="Technology">Technology</option>
                            <option value="Comedy">Comedy</option>
                            <option value="News">News</option>
                            <option value="Education">Education</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Summary / Description</label>
                        <textarea name="description" rows="3" placeholder="What's your podcast about?"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Intro Audio / Thumbnail (Max 50MB)</label>
                        <input type="file" name="podcastFile" accept="audio/*,image/*">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Create Podcast</button>
            </form>
        </div>

        <div class="podcast-grid">
            <div th:each="p : ${podcasts}" class="podcast-card" th:onclick="'playPodcast(' + ${p.podcastId} + ')'"
                style="cursor: pointer;">
                <div th:if="${p.coverImageUrl == null || p.coverImageUrl.isEmpty()}" class="podcast-icon">📻</div>
                <img th:if="${p.coverImageUrl != null && !p.coverImageUrl.isEmpty()}" th:src="${p.coverImageUrl}"
                    class="podcast-icon" style="object-fit: cover; background: none;">
                <div class="podcast-info">
                    <span class="category" th:text="${p.category}">Category</span>
                    <h3 th:text="${p.title}">Podcast Title</h3>
                    <p th:text="${p.description}">No description provided.</p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(podcasts)}" class="empty-state"
                style="grid-column: 1/-1; text-align: center; padding: 40px; color: #b3b3b3;">
                <p style="font-size: 3em;">🎙️</p>
                <p style="margin-top: 16px;">You haven't created any podcasts yet.</p>
            </div>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <div th:fragment="scripts">
        <script th:inline="javascript">
            window.pagePodcasts = /*[[${podcasts}]]*/[];
        </script>
    </div>
</body>

</html>
