<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <div th:fragment="navbar" class="sidebar">
        <div class="logo">
            <span sec:authorize="hasRole('ARTIST')">🎵 RevPlay Artist</span>
            <span sec:authorize="!hasRole('ARTIST')">🎵 RevPlay</span>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-header">BROWSE</div>
            <a sec:authorize="hasRole('ARTIST')" th:href="@{/artist/dashboard}" class="nav-item">
                <span class="icon">🏠</span> Home
            </a>
            <a sec:authorize="!hasRole('ARTIST')" th:href="@{/user/dashboard}" class="nav-item">
                <span class="icon">🏠</span> Home
            </a>

            <a th:href="@{/user/library}" class="nav-item">
                <span class="icon">🎶</span> Songs
            </a>
            <a th:href="@{/user/browse-genres}" class="nav-item">
                <span class="icon">📚</span> Genres
            </a>
            <a th:href="@{/user/browse-albums}" class="nav-item">
                <span class="icon">💿</span> Albums
            </a>
            <a th:href="@{/user/browse-artists}" class="nav-item">
                <span class="icon">👥</span> Artists
            </a>
            <a th:href="@{/user/browse-podcasts}" class="nav-item">
                <span class="icon">🎙️</span> Podcasts
            </a>
        </div>

        <div sec:authorize="hasRole('ARTIST')" class="sidebar-section">
            <div class="sidebar-header">ARTIST STUDIO</div>
            <a th:href="@{/artist/upload}" class="nav-item">
                <span class="icon">📤</span> Upload Song
            </a>
            <a th:href="@{/artist/my-songs}" class="nav-item">
                <span class="icon">🎶</span> My Songs
            </a>
            <a th:href="@{/artist/albums}" class="nav-item">
                <span class="icon">💿</span> My Albums
            </a>
            <a th:href="@{/artist/my-podcasts}" class="nav-item">
                <span class="icon">📻</span> My Podcasts
            </a>
            <a th:href="@{/artist/analytics}" class="nav-item">
                <span class="icon">📈</span> Analytics
            </a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-header">YOUR COLLECTION</div>
            <a th:href="@{/user/playlists}" class="nav-item">
                <span class="icon">🎵</span> Create Playlist
            </a>
            <a th:href="@{/user/all-playlists}" class="nav-item">
                <span class="icon">🌍</span> All Playlists
            </a>
            <a th:href="@{/user/favorites}" class="nav-item">
                <span class="icon">❤️</span> Favorites
            </a>
            <a th:href="@{/user/history}" class="nav-item">
                <span class="icon">🕓</span> History
            </a>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-header">ACCOUNT</div>
            <a th:href="@{/user/profile}" class="nav-item">
                <span class="icon">👤</span> Profile
            </a>
        </div>

        <a th:href="@{/logout}" class="nav-item" style="margin-top: auto; color: var(--error); border-left: none;">
            <span class="icon">🚪</span> Logout
        </a>
    </div>
</body>

</html>
